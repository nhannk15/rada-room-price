version: '3.8'

services:
  db:
    image: postgres:15
    container_name: radar-db
    environment:
      - POSTGRES_USER=radar_user
      - POSTGRES_PASSWORD=radar_pass
      - POSTGRES_DB=radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d radar" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: eclipse-temurin:21-jdk
    container_name: radar_backend
    command: ["sh", "-c", "echo \"Backend placeholder – sẽ chạy Spring Boot sau\" && sleep 3600"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/radar
      SPRING_DATASOURCE_USERNAME: radar_user
      SPRING_DATASOURCE_PASSWORD: radar_pass

volumes:
  pgdata: