  <line x1="291" y1="300" x2="319" y2="300" stroke="#FF6B2B" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(255, 107, 43);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="375" y1="288" x2="375" y2="312" stroke="#FF6B2B" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(255, 107, 43);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="361" y1="300" x2="389" y2="300" stroke="#FF6B2B" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgb(255, 107, 43);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Chimney -->
  <rect x="376" y="212" width="20" height="38" rx="2" fill="#E8521A" style="fill:rgb(232, 82, 26);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Radar ping dot (signal detected) -->
  <circle cx="432" cy="196" r="6" fill="#FF6B2B" fill-opacity="0.9" style="fill:rgb(255, 107, 43);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="432" cy="196" r="11" fill="none" stroke="#FF6B2B" stroke-width="1.5" stroke-opacity="0.5" style="fill:none;stroke:rgb(255, 107, 43);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="432" cy="196" r="17" fill="none" stroke="#FF6B2B" stroke-width="1" stroke-opacity="0.3" style="fill:none;stroke:rgb(255, 107, 43);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

