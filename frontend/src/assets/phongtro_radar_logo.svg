  <line x1="340" y1="65" x2="340" y2="455" stroke="#FF6B2B" stroke-width="0.8" stroke-opacity="0.2" style="fill:rgb(0, 0, 0);stroke:rgb(255, 107, 43);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

