  <line x1="340" y1="260" x2="462" y2="196" stroke="#FF6B2B" stroke-width="1.8" stroke-opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(255, 107, 43);color:rgb(0, 0, 0);stroke-width:1.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="340" y1="260" x2="340" y2="120" stroke="#FF6B2B" stroke-width="1.2" stroke-opacity="0.3" style="fill:rgb(0, 0, 0);stroke:rgb(255, 107, 43);color:rgb(0, 0, 0);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- House shape — centered, bold -->
  <!-- Roof -->
  <polygon points="256,272 340,190 424,272" fill="#FF6B2B" stroke="none" style="fill:rgb(255, 107, 43);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Roof overhang detail -->
